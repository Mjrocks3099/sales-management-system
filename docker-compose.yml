services:

  mysql:
    image: mysql:8.0
    container_name: simp-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: simp
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: simpuser
      MYSQL_PASSWORD: simp_password

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  backend:
    build:
      context: ./simp-backend
      dockerfile: Dockerfile

    container_name: simp-backend
    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/simp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: simpuser
      SPRING_DATASOURCE_PASSWORD: simp_password

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8081:8080"


  frontend:
    build:
      context: ./simp-frontend
      dockerfile: Dockerfile

    container_name: simp-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"


volumes:
  mysql_data: